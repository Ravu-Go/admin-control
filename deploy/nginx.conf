map $uri $cache_policy {
  default "no-store";
  ~^/assets/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control $cache_policy always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://staging-api.ravultd.com; connect-src 'self' https://staging-api.ravultd.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /health { access_log off; default_type application/json; return 200 '{"name":"Ravu Admin Control Centre","status":"ok","mode":"static-shell"}'; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
