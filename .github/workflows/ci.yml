name: Admin UI
on:
  push:
    branches: [staging, 'admin/**']
  pull_request:
    branches: [staging, main]
permissions:
  contents: read
concurrency:
  group: admin-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run verify:contract
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: admin-staging-build
          path: dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan source with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build staging container
        run: docker build -t ravu-admin-ci .
      - name: Verify container health, deep links and security headers
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ravu-admin-ci -p 127.0.0.1:4180:80 ravu-admin-ci
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4180/health | python3 -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"
          curl -fsS http://127.0.0.1:4180/accounts | grep -qi '<!doctype html'
          curl -fsSI http://127.0.0.1:4180/accounts > "$RUNNER_TEMP/admin-headers"
          grep -qi '^Content-Security-Policy:' "$RUNNER_TEMP/admin-headers"
          grep -qi '^X-Content-Type-Options: nosniff' "$RUNNER_TEMP/admin-headers"
          grep -qi '^X-Frame-Options: DENY' "$RUNNER_TEMP/admin-headers"
          grep -qi '^Cache-Control: no-store' "$RUNNER_TEMP/admin-headers"
          curl -fsS http://127.0.0.1:4180/icons/navigation.svg > /dev/null
      - name: Clean up test container
        if: always()
        run: docker rm -f ravu-admin-ci || true
